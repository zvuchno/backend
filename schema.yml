openapi: 3.0.3
info:
  title: Zvuchno API
  version: 1.0.0
  description: Документация API проекта
paths:
  /api/v1/artists/:
    get:
      operationId: v1_artists_list
      description: Возвращает публичный список активных артистов. Фильтр по жанру,
        поиск, пагинация.
      summary: Получить список артистов
      parameters:
      - in: query
        name: genre
        schema:
          type: string
        description: Фильтр по жанру альбомов артиста.
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество элементов в ответе.
      - in: query
        name: offset
        schema:
          type: integer
        description: Смещение от начала выборки.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка. Например: name, -name, created_at, -created_at.'
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию, slug, городу.
      tags:
      - Artists
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistPublicShortList'
          description: ''
  /api/v1/artists/me/:
    get:
      operationId: v1_artists_me_retrieve
      description: Возвращает профиль артиста или лейбла текущего пользователя вместе
        с контактами и ссылками на внешние ресурсы.
      summary: Получить свой профиль артиста или лейбла
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistMe'
          description: ''
    patch:
      operationId: v1_artists_me_partial_update
      description: 'Частично обновляет профиль артиста или лейбла текущего пользователя.
        При передаче contacts и socials списки синхронизируются целиком: новые элементы
        создаются, существующие обновляются, а отсутствующие в запросе удаляются.'
      summary: Обновить свой профиль артиста или лейбла
      tags:
      - Artists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtistMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtistMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtistMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistMeUpdate'
          description: ''
  /api/v1/artists/me/cover/:
    patch:
      operationId: v1_artists_me_cover_partial_update
      description: Загружает или заменяет обложку профиля текущего артиста. Запрос
        должен быть отправлен в формате multipart/form-data.
      summary: Обновить обложку своего профиля артиста
      tags:
      - Artists
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtistCoverUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtistCoverUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistCoverUpdate'
          description: ''
  /api/v1/artists/me/legal/:
    get:
      operationId: v1_artists_me_legal_retrieve
      description: Возвращает юридический профиль, паспортные и банковские данные
        текущего артиста.
      summary: Получить юридические данные артиста
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistLegal'
          description: ''
    patch:
      operationId: v1_artists_me_legal_partial_update
      description: Частично обновляет юридический профиль, паспортные и банковские
        данные текущего артиста. Отсутствующие блоки не изменяются.
      summary: Обновить юридические данные артиста
      tags:
      - Artists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArtistLegalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArtistLegalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArtistLegalRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistLegal'
          description: ''
  /api/v1/artists/me/legal/recipient-types/:
    get:
      operationId: v1_artists_me_legal_recipient_types_list
      description: Возвращает список допустимых значений поля recipient_type.
      summary: Справочник организационных форм получателя выплат
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Choice'
          description: ''
  /api/v1/artists/me/sales/:
    get:
      operationId: v1_artists_me_sales_list
      description: Возвращает список заказов для продавца.
      summary: Получить список заказов
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество элементов в ответе
      - in: query
        name: offset
        schema:
          type: integer
        description: Смещение от начала выборки
      - in: query
        name: search
        schema:
          type: string
        description: 'Поиск по номеру заказа, названию товара или SKU '
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArtistSaleList'
          description: ''
  /api/v1/artists/me/sales/{id}/:
    get:
      operationId: v1_artists_me_sales_retrieve
      description: Возвращает подробную информацию о заказе для продавца по id.
      summary: Получить заказ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistSaleDetail'
          description: ''
  /api/v1/artists/me/telegram/connect/:
    post:
      operationId: v1_artists_me_telegram_connect_create
      description: Генерирует одноразовую ссылку для подключения Telegram-бота и привязывает
        артиста после /start.
      summary: Подключение Telegram для артиста
      tags:
      - Artists
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  connected:
                    type: boolean
          description: ''
  /api/v1/artists/profile/{slug}/:
    get:
      operationId: v1_artists_profile_retrieve
      description: Возвращает публичные данные активного профиля артиста или лейбла
        по его slug.
      summary: Получить публичный профиль артиста или лейбла
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Artists
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistPublic'
          description: ''
  /api/v1/auth/account/me/:
    get:
      operationId: v1_auth_account_me_retrieve
      description: Возвращает данные текущего авторизованного пользователя, включая
        контакты, флаги подтверждения, наличие активных профилей и тип профиля - артист
        или лейбл.
      summary: Текущая учетная запись
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/auth/account/me/become_artist/:
    post:
      operationId: v1_auth_account_me_become_artist_create
      description: Создает профиль артиста или лейбла для текущего авторизованного
        пользователя. Тип профиля определяется полем profile_type. Если такой профиль
        уже существует, возвращает ошибку.
      summary: Стать артистом или лейблом
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BecomeArtistOrLabelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BecomeArtistOrLabelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BecomeArtistOrLabelRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BecomeArtistOrLabel'
          description: ''
  /api/v1/auth/account/me/change-password/:
    post:
      operationId: v1_auth_account_me_change_password_create
      description: Изменяет пароль текущего пользователя по старому паролю.
      summary: Изменить пароль
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/me/change-phone/:
    patch:
      operationId: v1_auth_account_me_change_phone_partial_update
      description: Обновляет номер телефона текущего пользователя. После изменения
        телефон помечается как неподтвержденный.
      summary: Изменить номер телефона
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPhoneChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPhoneChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPhoneChangeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneChange'
          description: ''
  /api/v1/auth/account/me/change-username/:
    patch:
      operationId: v1_auth_account_me_change_username_partial_update
      description: Меняет имя пользователя, проверяет уникальность.
      summary: Изменить имя пользователя (username)
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUsernameChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUsernameChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUsernameChangeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameChange'
          description: ''
  /api/v1/auth/account/me/resend-email/:
    post:
      operationId: v1_auth_account_me_resend_email_create
      description: Повторно инициирует отправку ссылки для подтверждения email текущего
        пользователя.
      summary: Повторно отправить письмо подтверждения
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/me/set-password/:
    post:
      operationId: v1_auth_account_me_set_password_create
      description: Устанавливает пароль текущему авторизованному пользователю, если
        у его учетной записи ещё нет пригодного для входа пароля. Например, после
        регистрации через социальную сеть.
      summary: Установить пароль
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/reset-password/:
    post:
      operationId: v1_auth_account_reset_password_create
      description: Принимает email пользователя и инициирует процесс восстановления
        пароля. Если учетная запись существует, для нее формируется ссылка восстановления.
      summary: Запросить восстановление пароля
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/reset-password-confirm/:
    post:
      operationId: v1_auth_account_reset_password_confirm_create
      description: Повторно проверяет uid и токен восстановления пароля, а затем устанавливает
        новый пароль пользователя.
      summary: Подтвердить восстановление пароля
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/reset-password-verify/:
    post:
      operationId: v1_auth_account_reset_password_verify_create
      description: Проверяет корректность uid и токена из ссылки восстановления пароля
        и сообщает, действительна ли ссылка.
      summary: Проверить ссылку восстановления пароля
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/account/verify-email/:
    post:
      operationId: v1_auth_account_verify_email_create
      description: Подтверждает email пользователя по uid и токену.
      summary: Подтвердить email
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/artist/:
    post:
      operationId: v1_auth_register_artist_create
      description: Создает учетную запись пользователя, профиль слушателя и связанный
        профиль артиста или лейбла. Тип профиля определяется полем profile_type.
      summary: Регистрация артиста или лейбла
      tags:
      - Registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtistRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArtistRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArtistRegistrationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistRegistrationResponse'
          description: ''
  /api/v1/auth/register/listener/:
    post:
      operationId: v1_auth_register_listener_create
      description: Создает учетную запись пользователя и связанный профиль слушателя.
      summary: Регистрация слушателя
      tags:
      - Registration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListenerRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ListenerRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ListenerRegistrationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenerRegistration'
          description: ''
  /api/v1/auth/social/error-codes/:
    get:
      operationId: v1_auth_social_error_codes_retrieve
      description: Возвращает словарь кодов ошибок social auth и их базовых текстовых
        описаний. Фронтенд может использовать коды как контракт, а тексты — как fallback
        или для отладки.
      summary: Справочник кодов ошибок social auth
      tags:
      - Auth
      responses:
        '200':
          description: No response body
  /api/v1/auth/social/get_tokens/:
    post:
      operationId: v1_auth_social_get_tokens_create
      description: |-
        Старый session-based flow. Не стоит использовать для новой интеграции фронтенда.

        Работает только после успешной аутентификации через allauth и установки session cookie: endpoint обменивает текущую серверную сессию на access и refresh JWT токены.

        Точки входа в старый social auth flow:
        - /accounts/vk/login/
        - /accounts/yandex/login/

        VK OAuth может требовать альтернативный host из-за ограничений провайдера по разрешенным доменам. Yandex работает на основном dev-домене.

        Требует активной session cookie и CSRF токена.

        Для новой интеграции использовать API endpoints /api/v1/auth/social/vk/ и /api/v1/auth/social/yandex/.
      summary: 'LEGACY: обмен server session на JWT токены'
      tags:
      - Auth
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/social/vk/:
    post:
      operationId: v1_auth_social_vk_create
      description: |-
        Основной способ social auth для новой интеграции фронтенда. Использовать эти endpoints вместо старого session exchange flow.

        Принимает code от провайдера и возвращает пару JWT-токенов. Если профиль соцсети ранее не был привязан к аккаунту, выполняется поиск по email или создание нового пользователя.

        VK OAuth может требовать альтернативный host из-за ограничений провайдера по разрешенным доменам. Yandex работает на основном dev-домене.

        Требует совместной проверки с фронтом и реальным OAuth flow.
      summary: Основной API endpoint для social auth через провайдера
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/social/yandex/:
    post:
      operationId: v1_auth_social_yandex_create
      description: |-
        Основной способ social auth для новой интеграции фронтенда. Использовать эти endpoints вместо старого session exchange flow.

        Принимает code от провайдера и возвращает пару JWT-токенов. Если профиль соцсети ранее не был привязан к аккаунту, выполняется поиск по email или создание нового пользователя.

        VK OAuth может требовать альтернативный host из-за ограничений провайдера по разрешенным доменам. Yandex работает на основном dev-домене.

        Требует совместной проверки с фронтом и реальным OAuth flow.
      summary: Основной API endpoint для social auth через провайдера
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialAuthInputRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
  /api/v1/auth/token/create/:
    post:
      operationId: v1_auth_token_create_create
      description: Аутентифицирует пользователя и возвращает access- и refresh-токены.
      summary: Вход в систему
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
