    get:
      operationId: v1_store_orders_list
      description: Возвращает список заказов пользователя.
      summary: Список заказов
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество элементов в ответе
      - in: query
        name: offset
        schema:
          type: integer
        description: Смещение от начала выборки
      - in: query
        name: search
        schema:
          type: string
        description: 'Поиск по номеру заказа, названию товара или SKU '
      tags:
      - Listener
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
  /api/v1/store/orders/{id}/:
    get:
      operationId: v1_store_orders_retrieve
      description: Возвращает подробную информацию о заказе по id.
      summary: Получить заказ
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this заказ.
        required: true
      tags:
      - Listener
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
          description: ''
  /api/v1/store/orders/checkout/:
    get:
      operationId: v1_store_orders_checkout_retrieve
      description: |-
        Возвращает дефолтные данные пользователя, сумму корзины, список доступных доставок и точки самовывоза у артиста.

        Особенность: если в корзине физические позиции от нескольких артистов - точки самовывоза артиста не возвращаются.
      summary: Данные для оформления заказа
      tags:
      - Checkout
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutInfoResponse'
          description: ''
    post:
      operationId: v1_store_orders_checkout_create
      description: Валидирует данные и создает заказ на основе корзины.
      summary: Создание заказа
      tags:
      - Checkout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/v1/store/payments/create/:
    post:
      operationId: v1_store_payments_create_create
      description: Инициирует создание платежа в ЮKassa для указанного заказа и возвращает
        токен для инициализации виджета оплаты на фронтенде.
      summary: Инициализация платежа
      tags:
      - Payments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  description: Идентификатор заказа
              required:
              - order_id
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmation_token:
                    type: string
                    description: Токен подтверждения для встроенного виджета ЮKassa
              examples:
                УспешныйОтвет:
                  value:
                    confirmation_token: ct-2845c43d-000f-5000-9000-1123456789ab
                  summary: Успешный ответ
          description: Платеж успешно инициирован
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
          description: Заказ не найден
  /api/v1/store/player/albums/{album_id}/:
    get:
      operationId: v1_store_player_albums_retrieve
      description: Возвращает альбом и доступные для текущего пользователя треки в
        порядке их позиции. Каждый трек содержит товарные данные и объект playback.
        Поле playback.duration показывает длительность фактически доступного источника,
        которая может отличаться от полной длительности трека.
      summary: Получить очередь воспроизведения релиза
      parameters:
      - in: path
        name: album_id
        schema:
          type: integer
        required: true
      tags:
      - Player
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerAlbum'
          description: ''
        '404':
          description: Релиз не найден или недоступен.
  /api/v1/store/player/tracks/{track_id}/play/:
    get:
      operationId: v1_store_player_tracks_play_retrieve
      description: Проверяет доступность трека и перенаправляет браузер на подходящий
        источник аудио. Сейчас доступно публичное preview; позднее endpoint сможет
        выбирать полный stream для пользователя с правом доступа. Клиенту следует
        передавать этот URL непосредственно в src элемента audio и позволить браузеру
        обработать redirect.
      summary: Запустить воспроизведение трека
      parameters:
      - in: path
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - Player
      responses:
        '302':
          description: Перенаправление на аудиофайл. Адрес источника передаётся в
            заголовке Location.
        '404':
          description: Трек не найден, недоступен или preview временно не содержит
            готового файла.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackNotReady'
          description: ''
  /api/v1/store/promocodes/:
    get:
      operationId: v1_store_promocodes_list
      description: Возвращает промокоды текущего артиста.
      summary: Список промокодов
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - Promocodes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPromocodeReadList'
          description: ''
    post:
      operationId: v1_store_promocodes_create
      description: 'Создаёт промокод от имени текущего артиста. '
      summary: Создать промокод
      tags:
      - Promocodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromocodeWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PromocodeWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PromocodeWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromocodeReadDetail'
          description: ''
  /api/v1/store/promocodes/{id}/:
    get:
      operationId: v1_store_promocodes_retrieve
      description: Детальная информация о промокоде.
      summary: Получить промокод
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this промокод.
        required: true
      tags:
      - Promocodes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromocodeReadDetail'
          description: ''
    patch:
      operationId: v1_store_promocodes_partial_update
      description: Обновляет только переданные поля.
      summary: Частично обновить промокод
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this промокод.
        required: true
      tags:
      - Promocodes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPromocodeWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPromocodeWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPromocodeWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromocodeReadDetail'
          description: ''
    delete:
      operationId: v1_store_promocodes_destroy
      description: Удаляет промокод.
      summary: Удалить промокод
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this промокод.
        required: true
      tags:
      - Promocodes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/store/track-uploads/{upload_id}/complete/:
    post:
      operationId: v1_store_track_uploads_complete_create
      description: Завершает прямую загрузку после того, как клиент успешно отправил
        файл по transport-инструкции. Проверяет staging-файл, переносит его в постоянное
        хранилище, назначает audio_file и position треку, помечает загрузку завершённой
        и запускает подготовку audio preview/stream.
      summary: Завершить загрузку трека
      parameters:
      - in: path
        name: upload_id
        schema:
          type: integer
        required: true
      tags:
      - Tracks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackUploadResponse'
          description: ''
        '400':
          description: Staging-файл не найден или не прошёл проверку.
        '403':
          description: Нет доступа к загрузке.
        '404':
          description: Загрузка не найдена.
  /api/v1/store/track-uploads/{upload_id}/file/:
    post:
      operationId: v1_store_track_uploads_file_create
      description: Локальный dev-endpoint для загрузки файла через Django, когда Object
        Storage отключён. В production при USE_S3_MEDIA=True этот endpoint недоступен.
      summary: Передать файл в локальное staging-хранилище
      parameters:
      - in: path
        name: upload_id
        schema:
          type: integer
        required: true
      tags:
      - Tracks
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackUploadLocalFileResponse'
          description: ''
        '400':
          description: Файл не передан или невалиден.
        '403':
          description: Нет доступа к загрузке.
        '404':
          description: Загрузка не найдена или endpoint отключен.
  /api/v1/store/tracks/:
    get:
      operationId: v1_store_tracks_list
      description: Возвращает список всех аудиозаписей.
      summary: Список треков
      parameters:
      - in: query
        name: album
        schema:
          type: integer
        description: Фильтр по ID альбома
      - in: query
        name: artist
        schema:
          type: string
        description: Фильтр по slug артиста
      - in: query
        name: genre
        schema:
          type: string
        description: Фильтр по slug жанра
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество элементов в ответе.
      - in: query
        name: name
        schema:
          type: string
        description: Фильтр по названию трека (icontains)
      - in: query
        name: offset
        schema:
          type: integer
        description: Смещение от начала выборки.
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Сортировка: position, -position, name, -name'
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию
      tags:
      - Tracks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrackReadList'
          description: ''
    post:
      operationId: v1_store_tracks_create
      description: 'Создаёт новую запись трека и принимает аудиофайл через multipart/form-data.
        Этот способ оставлен для простых одиночных загрузок и обратной совместимости.
        Для больших файлов и стабильной загрузки рекомендуется использовать прямую
        загрузку: инициализация → загрузка файла по transport-инструкции → завершение
        загрузки.'
      summary: Загрузить трек простым способом
      tags:
      - Tracks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackReadDetail'
          description: ''
  /api/v1/store/tracks/{id}/:
    get:
      operationId: v1_store_tracks_retrieve
      description: Возвращает детальную информацию о треке по id.
      summary: Получить трек
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this трек.
        required: true
      tags:
      - Tracks
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackReadDetail'
          description: ''
    patch:
      operationId: v1_store_tracks_partial_update
      description: Обновляет только переданные поля трека. Если передан audio_file,
        файл загружается через backend простым multipart-способом. Для больших файлов
        предпочтительнее прямой upload flow.
      summary: Частично обновить трек
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this трек.
        required: true
      tags:
      - Tracks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTrackWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTrackWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTrackWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackReadDetail'
          description: ''
    delete:
      operationId: v1_store_tracks_destroy
      description: Удаляет запись трека.
      summary: Удалить трек
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this трек.
        required: true
      tags:
      - Tracks
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/store/tracks/{track_id}/file-upload/initiate/:
    post:
      operationId: v1_store_tracks_file_upload_initiate_create
      description: Создаёт попытку прямой загрузки нового оригинального аудиофайла
        для существующего трека и возвращает инструкцию для отправки файла. Клиент
        должен отправить файл по адресу upload.transport.url, передав все поля из
        upload.transport.fields и сам файл в поле upload.transport.file_field_name.
        После успешной отправки файла нужно вызвать upload.complete_url. При завершении
        загрузки сохраняются id трека, альбом, позиция и данные продажи.
      summary: Инициализировать замену файла трека
      parameters:
      - in: path
        name: track_id
        schema:
          type: integer
        required: true
      tags:
      - Tracks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackUploadFileInitiateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackUploadFileInitiateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackUploadFileInitiateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackUploadResponse'
          description: ''
        '400':
          description: Ошибка валидации файла.
        '403':
          description: Нет доступа к треку.
        '404':
          description: Трек не найден.
        '503':
          description: Не настроен транспорт загрузки.
components:
  schemas:
    AlbumArchiveStatusEnum:
      enum:
      - pending
      - building
      - ready
      - failed
      type: string
      description: |-
        * `pending` - Ожидает сборки
        * `building` - Собирается
        * `ready` - Готов
        * `failed` - Ошибка
    AlbumRead:
      type: object
      description: Сериализатор для чтения Album.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        description:
          type: string
          title: Описание
        cover_image:
          type: string
          format: uri
          nullable: true
          title: Обложка релиза
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          title: Приватность
        is_published:
          type: boolean
          title: Опубликовано
          description: Если включено, объект виден пользователям.
      required:
      - id
      - name
      - price
    AlbumReadDetail:
      type: object
      description: Сериализатор для подробного просмотра (retrieve) объекта Album.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Название
          maxLength: 255
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        description:
          type: string
          title: Описание
        cover_image:
          type: string
          format: uri
          nullable: true
          title: Обложка релиза
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          title: Приватность
        is_published:
          type: boolean
          title: Опубликовано
          description: Если включено, объект виден пользователям.
        is_single:
          type: boolean
          title: Сингл
        genre:
          type: string
          readOnly: true
        release_date:
          type: string
          format: date
          nullable: true
          title: Дата релиза
        allow_overpay:
          type: boolean
          readOnly: true
        variants:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: |-
            Унифицирует формат вариантов для альбома.

            Возвращает список с единственным дефолтным вариантом, чтобы фронтенд
            мог использовать общую логику обработки (как для мерча).
            'value' пустое, так как выбор не требуется.
          readOnly: true
      required:
      - allow_overpay
      - genre
      - id
      - name
      - price
      - variants
    AlbumWriteRequest:
      type: object
      description: Сериализатор для создания и обновления Album.
      properties:
        name:
          type: string
          minLength: 1
          title: Название
          maxLength: 255
        artist:
          type: integer
          title: Артист
        is_single:
          type: boolean
          title: Сингл
        release_date:
          type: string
          format: date
          nullable: true
          title: Дата релиза
        genre:
          type: integer
          nullable: true
          title: Жанр
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        description:
          type: string
          title: Описание
        cover_image:
          type: string
          format: binary
          nullable: true
          title: Обложка релиза
        allow_overpay:
          type: boolean
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          title: Приватность
        is_published:
          type: boolean
          title: Опубликовано
          description: Если включено, объект виден пользователям.
      required:
      - name
      - price
    ApplyPromocodeRequest:
      type: object
      description: Сериализатор входящего промокода.
      properties:
        code:
          type: string
          minLength: 1
          pattern: ^[A-Z0-9_-]+$
          maxLength: 20
      required:
      - code
    ArchiveNotReady:
      type: object
      description: Состояние неподготовленного альбомного архива.
      properties:
        detail:
          type: string
        status:
          $ref: '#/components/schemas/AlbumArchiveStatusEnum'
      required:
      - detail
      - status
    ArtistBankData:
      type: object
      description: Сериализатор банковских данных артиста.
      properties:
        bank_name:
          type: string
          title: Название банка
          maxLength: 255
        bik:
          type: string
          title: БИК
          maxLength: 9
        correspondent_account:
          type: string
          title: Корреспондентский счет
          maxLength: 20
        checking_account:
          type: string
          title: Расчетный счет
          maxLength: 20
    ArtistBankDataRequest:
      type: object
      description: Сериализатор банковских данных артиста.
      properties:
