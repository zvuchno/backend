    post:
      operationId: v1_store_merch_create
      description: |-
        Создаёт новый мерч.

        Если поле `variants` передано — оно должно содержать ПОЛНЫЙ список вариантов. Отсутствующие варианты будут деактивированы.

        Логика работы с вариантами:
        - вариант без `id` → создаёт
        - вариант с `id` → обновляет
        - вариант отсутствует в списке → деактивирует
        - нет `id`, но значение есть среди деактивированных → реанимирует и обновляет
        - `variants: []` → деактивирует все
      summary: Создать мерч
      tags:
      - Merch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MerchWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MerchWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchDetail'
          description: ''
