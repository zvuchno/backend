  /api/v1/store/cart/me/:
    get:
      operationId: v1_store_cart_me_retrieve
      description: "Возвращает состав корзины, итоговые суммы и примененный купон.\n###
        Логика работы:\n1. **Автосоздание**: \n   - Если у пользователя (или гостя)
        еще нет корзины, она будет создана автоматически при первом обращении.\n2.
        **Идентификация**: \n   - Для авторизованных пользователей корзина привязана
        к `User ID`.\n   - Для гостей используется `session_key` из Cookies (`sessionid`).
        \n3. **Слияние (Merge)**: \n   - При авторизации (Login) гостевая корзина
        автоматически объединяется с корзиной пользователя.\n\nДля перехода на карточку
        товара по клику используйте target.url и selected_variant_id чтобы открыть
        детальную карточку с заранее выбранным вариантом."
      summary: Просмотр корзины
