        required: true
      tags:
      - Deliveries
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                description: Список найденных городов и регионов
                items:
                  type: object
                  properties:
                    city_uuid:
                      type: string
                      format: uuid
                      description: Уникальный идентификатор города в СДЭК
                    code:
                      type: integer
                      description: Код города в СДЭК (используется для расчета доставки)
                    full_name:
                      type: string
                      description: Полное название населенного пункта с регионом и
                        страной
                    country_code:
                      type: string
                      description: Двухбуквенный код страны (например, RU)
              examples:
                УспешныйПоиск:
                  value:
                  - city_uuid: 35da643b-b56c-4a70-af07-e125a4458193
                    code: 288
                    full_name: Владивосток, Владивостокский городской округ, Приморский
                      край, Россия
                    country_code: RU
                  - city_uuid: 770f3275-921b-4552-a856-a16697d45691
                    code: 538682
                    full_name: Владивосток, департамент Луар и Шер, Центр-Долина Луары,
                      Франция
                    country_code: FR
                  summary: Успешный поиск
          description: ''
