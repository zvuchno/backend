  /api/v1/store/catalog/:
    get:
      operationId: v1_store_catalog_list
      description: |-
        Возвращает список витринных карточек товаров.

        Карточка может представлять релиз, носитель или обычный мерч. Для перехода по клику фронтенд использует target.url.

        target показывает, какую детальную карточку нужно открыть. Например, карточка носителя может вести на детальную карточку релиза.

        Если карточка должна открыть детальную карточку с заранее выбранным вариантом, фронтенд может использовать selected_variant_id для сопоставления с variant_id в детальной карточке.

        selected_variant_id может быть null. Например, для обычного мерча вариант может выбираться уже на детальной карточке.

        Поле is_favorite показывает, добавлен ли товар в избранное. Сейчас избранное связано с вариантом товара, поэтому карточка считается избранной, если в избранном есть любой вариант этого товара.
      summary: Список товаров каталога
      parameters:
      - in: query
        name: artist
        schema:
          type: string
        description: Фильтр по slug артиста.
      - in: query
        name: genre
        schema:
          type: string
        description: 'Фильтр по slug жанров. Можно передать несколько значений через
          запятую: genre=rock,jazz. Применяется к релизам и носителям, связанным с
          релизом.'
      - in: query
        name: kind
        schema:
          type: string
        description: 'Фильтр по slug типов мерча. Можно передать несколько значений
          через запятую: kind=vinyl,tshirt. Применяется к мерчу и носителям.'
      - in: query
        name: limit
        schema:
          type: integer
        description: Количество элементов в ответе.
      - in: query
        name: offset
        schema:
          type: integer
        description: Смещение от начала выборки.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - created_at
          - random
        description: Сортировка товаров. created_at — сначала старые; -created_at
          или отсутствие параметра — сначала новые; random — случайный порядок.
      - in: query
        name: search
        schema:
          type: string
        description: Поиск по названию товара и имени артиста.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - album
          - all
          - merch
        description: Тип витрины. all или отсутствие параметра — релизы, носители
          и мерч; album — музыкальные релизы; merch — мерч и физические носители.
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCatalogCardList'
              examples:
                Релиз:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?offset=400&limit=100
                    previous: http://api.example.org/accounts/?offset=200&limit=100
                    results:
                    - name: Название релиза
                      artist_name: Артист
                      kind: Альбом
                      year: 2026
                      price: '500.00'
                      image: https://zvuchno.ru/media/albums/cover.jpg
                      is_favorite: false
                      target:
                        type: release
                        id: 10
                        url: /api/v1/store/catalog/release/10/
                        selected_variant_id: 111
                Носитель:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?offset=400&limit=100
                    previous: http://api.example.org/accounts/?offset=200&limit=100
                    results:
                    - name: Название релиза — винил
                      artist_name: Артист
                      kind: Винил
                      year: null
                      price: '2500.00'
                      image: https://zvuchno.ru/media/merch/vinyl.jpg
                      is_favorite: false
                      target:
                        type: release
                        id: 10
                        url: /api/v1/store/catalog/release/10/
                        selected_variant_id: 112
                ОбычныйМерч:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?offset=400&limit=100
                    previous: http://api.example.org/accounts/?offset=200&limit=100
                    results:
                    - name: Футболка
                      artist_name: Артист
                      kind: Футболка
                      year: null
                      price: '1500.00'
                      image: https://zvuchno.ru/media/merch/tshirt.jpg
                      is_favorite: false
                      target:
                        type: merch
                        id: 20
                        url: /api/v1/store/catalog/merch/20/
                        selected_variant_id: null
                  summary: Обычный мерч
          description: ''
  /api/v1/store/catalog/merch/{id}/:
    get:
      operationId: v1_store_catalog_merch_retrieve
      description: |-
        Возвращает данные обычного мерча для публичной витрины.

        Носители здесь не отдаются. Носители доступны как варианты покупки в детальной карточке релиза.

        Поле property_name показывает название свойства, по которому выбирается вариант: например размер или цвет.

        Для добавления в корзину используется variant_id выбранного варианта.
      summary: Детальная карточка мерча в каталоге
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogMerchDetail'
              examples:
                ОбычныйМерч:
                  value:
                    id: 20
                    name: Футболка
                    price: '1500.00'
                    description: Описание футболки.
                    artist_name: Артист
                    kind: Футболка
                    property_name: Размер
                    stock: 7
                    allow_overpay: false
                    images:
                    - image: https://zvuchno.ru/media/merch/tshirt.jpg
                      is_main: true
                    variants:
                    - variant_id: 301
                      sku: MER-20-V301
                      stock: 3
                      property_value: M
                    - variant_id: 302
                      sku: MER-20-V302
                      stock: 4
                      property_value: L
                  summary: Обычный мерч
          description: ''
  /api/v1/store/catalog/release/{id}/:
    get:
      operationId: v1_store_catalog_release_retrieve
      description: |-
        Возвращает данные релиза для публичной витрины.

        В корне ответа находятся данные самого релиза: название альбома, имя артиста, признак сингла и описание.

        Коммерческие данные находятся в variants. Каждый вариант содержит цену, остаток, возможность переплаты, изображения и variant_id для добавления в корзину.

        Первый элемент variants считается вариантом по умолчанию. Обычно это цифровая версия альбома.

        Если пользователь перешёл из карточки носителя, фронтенд может сопоставить selected_variant_id из карточки каталога с variant_id одного из вариантов в этом ответе и сразу выбрать нужный вариант.

        Для добавления в корзину используется variant_id выбранного варианта.
      summary: Детальная карточка релиза в каталоге
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogReleaseDetail'
              examples:
                РелизСЦифровымВариантомИВинилом:
                  value:
                    id: 10
                    artist_name: Артист
                    is_single: false
                    variants:
                    - variant_id: 101
                      sku: ALB-10-V101
                      stock: null
                      property_value: Диджитал
                      name: ''
                      price: '500.00'
                      allow_overpay: true
                      description: ''
                      images:
                      - image: https://zvuchno.ru/media/albums/cover.jpg
                        is_main: true
                    - variant_id: 202
                      sku: MER-20-V202
                      stock: 4
                      property_value: Винил
                      name: Название релиза — винил
                      price: '2500.00'
                      allow_overpay: false
                      description: Описание винила.
                      images:
                      - image: https://zvuchno.ru/media/merch/vinyl.jpg
                        is_main: true
                  summary: Релиз с цифровым вариантом и винилом
          description: ''
  /api/v1/store/cdek-calculate/:
    post:
      operationId: v1_store_cdek_calculate_create
      description: Принимает код города назначения и метод доставки. Группирует мерч
        в корзине по артистам, рассчитывает стоимость и сроки доставки для каждого
        плеча. Возвращает суммарную стоимость и минимальный/максимальный сроки доставки
        среди всех отправлений.
      summary: Расчет стоимости доставки СДЭК
      tags:
      - Deliveries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CdekCalculateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CdekCalculateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CdekCalculateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery_sum:
                    type: number
                    format: float
                    description: Итоговая стоимость доставки в рублях
                  period_min:
                    type: integer
                    nullable: true
                    description: Минимальный срок доставки в днях (с учетом худшего
                      плеча)
                  period_max:
                    type: integer
                    nullable: true
                    description: Максимальный срок доставки в днях (с учетом худшего
                      плеча)
              examples:
                УспешныйРасчет:
                  value:
                    delivery_sum: 450.0
                    period_min: 2
                    period_max: 5
                  summary: Успешный расчет
          description: ''
  /api/v1/store/cdek-cities/:
    get:
      operationId: v1_store_cdek_cities_retrieve
      description: Принимает поисковую строку (минимум 2 символа) в query-параметре
        и возвращает список подходящих населенных пунктов из базы СДЭК. Используется
        для динамического автокомплита на фронтенде.
      summary: Подсказки городов (автокомплит) через СДЭК
      parameters:
      - in: query
        name: query
        schema:
          type: string
