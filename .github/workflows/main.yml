name: Main Zvuchno workflow

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop

env:
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || 'dev' }}
  COMPOSE_FILE: ${{ github.ref_name == 'main' && 'docker-compose.production.yml' || 'docker-compose.dev.yml' }}
  SSH_HOST: ${{ github.ref_name == 'main' && secrets.SSH_HOST_PROD || secrets.SSH_HOST_DEV }}

jobs:

  build_and_push_to_docker_hub:
    name: Push Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile.prod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zvuchno_backend:${{ env.IMAGE_TAG }}

  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./nginx/
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/zvuchno_gateway:${{ env.IMAGE_TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Rename compose file to standard name
      run: cp ${{ env.COMPOSE_FILE }} docker-compose.yml
    - name: Copy docker-compose.yml via ssh
      uses: appleboy/scp-action@master
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "docker-compose.yml"
        target: "zvuchno"
    - name: Copy backup script via ssh
      uses: appleboy/scp-action@master
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "scripts/backup_postgres.sh"
        target: "zvuchno"

    - name: Executing remote ssh commands to deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          # Определяем ID пользователя
          CUR_UID=$(id -u)
          CUR_GID=$(id -g)

          # Указываем путь к сокету Докера
          export DOCKER_HOST=unix:///run/user/$CUR_UID/docker.sock

          cd zvuchno

          mkdir -p /home/zdocker/backups
          chmod 700 scripts/backup_postgres.sh

          # Проверяем наличие UID/GID в .env, если их нет — записываем
          grep -qq "^UID=" .env || echo "UID=$(id -u)" >> .env
          grep -qq "^GID=" .env || echo "GID=$(id -g)" >> .env

          echo "=== BEFORE ==="
          docker images --digests | grep zvuchno || true

          docker compose pull

          docker compose stop \
            backend \
            celery_worker \
            celery_archives \
            celery_media \
            celery_beat \
            bot

          docker compose up -d --wait \
            db \
            redis

          docker compose run --rm --no-deps \
            backend \
            python manage.py migrate --noinput

          echo "=== AFTER ==="
          docker images --digests | grep zvuchno || true

          docker compose up -d --wait

          docker image prune -f

          echo "Исправляем владельца волюмов на $CUR_UID:$CUR_GID..."
          docker run --rm \
            -v zvuchno_static:/fix_static \
            -v zvuchno_media:/fix_media \
            -v zvuchno_celery_beat_data:/fix_beat \
            -v zvuchno_flower_data:/fix_flower \
            alpine chown -R $CUR_UID:$CUR_GID /fix_static /fix_media /fix_beat /fix_flower

          docker compose exec backend python manage.py collectstatic --noinput
